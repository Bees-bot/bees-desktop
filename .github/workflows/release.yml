name: Release desktop

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            signing_identity: "-"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            signing_identity: "-"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            signing_identity: ""
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            signing_identity: ""

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # All six secrets are set, so tagged builds are signed with the Developer ID and
      # notarized. The matrix value stays as the ad-hoc fallback for a fork without them,
      # where the build still produces installers macOS will warn about.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || matrix.signing_identity }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Azure Artifact Signing, ~$10/month. Unset until the account exists; the Windows
      # build then produces unsigned installers and SmartScreen warns on them.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri imports the certificate itself, but not until it bundles, which is after the
      # build has already prepared and signed the local-model runtime. That step needs the
      # identity to exist, so import it here first. Without this, signing the runtime fails
      # with "The specified item could not be found in the keychain" and the build stops.
      - name: Import the Developer ID certificate
        if: startsWith(matrix.platform, 'macos-') && env.APPLE_CERTIFICATE != ''
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$certificate"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm "$certificate"
          security find-identity -v -p codesigning "$keychain"

      # Windows code signing through Azure Artifact Signing (renamed from Azure Trusted
      # Signing, and both names still turn up). Skipped until the account exists, so the build
      # keeps producing unsigned installers meanwhile.
      #
      # Installing the tool is only half of it. The other half is a one-line
      # `bundle.windows.signCommand` in tauri.conf.json, deliberately NOT added yet: Tauri
      # runs signCommand unconditionally, so committing it before the Azure account exists
      # breaks every Windows build. Add it in the same change that adds the secrets:
      #   "signCommand": "trusted-signing-cli -e %AZURE_ENDPOINT% -a %AZURE_CODE_SIGNING_NAME% -c %AZURE_CERT_PROFILE_NAME% %1"
      - name: Install Windows signing tool
        if: startsWith(matrix.platform, 'windows-') && env.AZURE_CLIENT_ID != ''
        run: cargo install trusted-signing-cli@0.5.0

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update manifest. Without both of these the build still produces
          # installers, but no `latest.json`, and installed apps never see the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          # OFF until an upgrade from 0.1.1 keeps a person's data. 0.1.1 shipped with the
          # updater plugin polling this repo's latest.json, and its pubkey matches the key
          # above, so publishing one here auto-installs the rewrite on every 0.1.1 machine.
          # That release read flue-state/flue.db and this one reads bees-stage1.db, so they
          # would silently open an empty app. Nothing in 0.2.0 reads latest.json anyway.
          includeUpdaterJson: false
          releaseName: "Bees v__VERSION__"
          releaseBody: |
            Private, local-first AI agents for organizations.

            Mac builds are signed and notarized when release credentials are configured. Installers are built for Apple Silicon, Intel Mac, Linux, and Windows.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # Tauri notarizes the .app but not the .dmg wrapped around it, so the disk image itself
      # comes back "Unnotarized Developer ID" from Gatekeeper even though the app inside is fine.
      # Notarize the image too and staple the ticket onto it, then replace the uploaded asset.
      # Stapling matters offline: without the ticket the check needs Apple reachable.
      - name: Notarize and staple the disk image
        if: startsWith(matrix.platform, 'macos-') && env.APPLE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find src-tauri/target -name "*.dmg" -type f | head -1)
          if [ -z "$dmg" ]; then
            echo "The build produced no .dmg to notarize."
            exit 1
          fi
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --verbose=2 --type install "$dmg"
          gh release upload "${{ github.ref_name }}" "$dmg" --clobber
