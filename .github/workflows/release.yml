name: Release desktop

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            signing_identity: "-"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            signing_identity: "-"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            signing_identity: ""
          # Windows is deliberately absent. Mac ships first and Windows follows in a
          # couple of weeks, once Azure Artifact Signing exists. Building it now would
          # publish an unsigned .msi next to a signed Mac build in the same release, and
          # SmartScreen blocks that, which is the thing BEE-026 is for. Linux stays: it
          # has no equivalent gate, so an unsigned build there is normal.
          #
          # To add it back, restore this entry and the signCommand noted below:
          #   - platform: windows-2025
          #     target: x86_64-pc-windows-msvc
          #     signing_identity: ""

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # Falls back to the matrix value (ad-hoc, `-`) until the Developer ID secret exists, so
      # the build keeps working meanwhile. An ad-hoc build is NOT notarizable, so macOS will
      # still warn on it. Set these four secrets to get a release people can install cleanly:
      #   APPLE_SIGNING_IDENTITY  "Developer ID Application: NAME (TEAMID)"
      #   APPLE_CERTIFICATE       base64 of the .p12
      #   APPLE_CERTIFICATE_PASSWORD
      #   APPLE_ID / APPLE_PASSWORD (app-specific) / APPLE_TEAM_ID  for notarytool
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || matrix.signing_identity }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Azure Artifact Signing, ~$10/month. Unset until the account exists; the Windows
      # build then produces unsigned installers and SmartScreen warns on them.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.3
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Windows code signing through Azure Artifact Signing (renamed from Azure Trusted
      # Signing, and both names still turn up). Skipped until the account exists, so the build
      # keeps producing unsigned installers meanwhile.
      #
      # Installing the tool is only half of it. The other half is a one-line
      # `bundle.windows.signCommand` in tauri.conf.json, deliberately NOT added yet: Tauri
      # runs signCommand unconditionally, so committing it before the Azure account exists
      # breaks every Windows build. Add it in the same change that adds the secrets:
      #   "signCommand": "trusted-signing-cli -e %AZURE_ENDPOINT% -a %AZURE_CODE_SIGNING_NAME% -c %AZURE_CERT_PROFILE_NAME% %1"
      - name: Install Windows signing tool
        if: startsWith(matrix.platform, 'windows-') && env.AZURE_CLIENT_ID != ''
        run: cargo install trusted-signing-cli@0.5.0

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update manifest. Without both of these the build still produces
          # installers, but no `latest.json`, and installed apps never see the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          # Writes the signed `latest.json` the updater endpoint points at.
          includeUpdaterJson: true
          releaseName: "Bees v__VERSION__"
          releaseBody: |
            Private, local-first AI agents for organizations.

            Choose the installer for your operating system below.

            macOS builds are ad-hoc signed, not Apple-notarized. On first launch,
            macOS may require approval in System Settings > Privacy & Security.
            Delete these two lines once the build is notarized, or the notes are wrong.

            There is no Windows build yet. It follows once code signing is set up.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
