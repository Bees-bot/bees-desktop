name: Release desktop

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            signing_identity: "-"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            signing_identity: "-"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            signing_identity: ""
          - platform: windows-2025
            target: x86_64-pc-windows-msvc
            signing_identity: ""

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Bees v__VERSION__"
          releaseBody: |
            Private, local-first AI agents for organizations.

            Choose the installer for your operating system below.

            macOS builds are ad-hoc signed, not Apple-notarized. On first launch,
            macOS may require approval in System Settings > Privacy & Security.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
