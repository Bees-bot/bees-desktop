name: Release desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Serialize releases so an older build cannot publish over a newer one.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - id: draft
        name: Validate version and prepare private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs draft

  build:
    needs: prepare
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            signing_identity: "-"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            signing_identity: "-"
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-2025
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      # All six secrets are set, so tagged builds are signed with the Developer ID and
      # notarized. The matrix value stays as the ad-hoc fallback for a fork without them,
      # where the build still produces installers macOS will warn about.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || matrix.signing_identity }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri imports the certificate itself, but not until it bundles, which is after the
      # build has already prepared and signed the local-model runtime. That step needs the
      # identity to exist, so import it here first. Without this, signing the runtime fails
      # with "The specified item could not be found in the keychain" and the build stops.
      - name: Import the Developer ID certificate
        if: startsWith(matrix.platform, 'macos-') && env.APPLE_CERTIFICATE != ''
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$certificate"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm "$certificate"
          security find-identity -v -p codesigning "$keychain"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          # OFF until an upgrade from 0.1.1 keeps a person's data. 0.1.1 shipped with the
          # updater plugin polling this repo's latest.json, and its pubkey matches whatever
          # key signed that release, so publishing one here auto-installs the rewrite on
          # every 0.1.1 machine.
          # That release read the legacy runtime database and this one reads bees-stage1.db, so they
          # would silently open an empty app. Nothing in 0.2.0 reads latest.json anyway.
          uploadUpdaterJson: false
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # Tauri notarizes the .app but not the .dmg wrapped around it, so the disk image itself
      # comes back "Unnotarized Developer ID" from Gatekeeper even though the app inside is fine.
      # Notarize the image too and staple the ticket onto it, then replace the uploaded asset.
      # Stapling matters offline: without the ticket the check needs Apple reachable.
      - name: Notarize and staple the disk image
        if: startsWith(matrix.platform, 'macos-') && env.APPLE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(find src-tauri/target -name "*.dmg" -type f | head -1)
          if [ -z "$dmg" ]; then
            echo "The build produced no .dmg to notarize."
            exit 1
          fi
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl --assess --verbose=2 --type install "$dmg"
          gh release upload "${{ github.ref_name }}" "$dmg" --clobber

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Verify all installers, checksum, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs publish

  announce:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Announce published release to Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: node scripts/release.mjs notify
