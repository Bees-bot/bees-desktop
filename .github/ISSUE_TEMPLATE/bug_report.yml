name: Bug report
description: Something broke, crashed, or behaved differently from what the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Use the private advisory link below instead.
  - type: input
    id: version
    attributes:
      label: Bees version
      description: Right-click Bees in Applications, choose Get Info, and check Version. Or the file name of the installer you ran.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. macOS 14 Apple Silicon, macOS 13 Intel, Windows 11, Ubuntu 22.04
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The app writes runtime.log and startup.log to a dsh-state folder inside its data folder (Settings → Removing Bees names that folder). Paste the lines around the failure and remove any keys, tokens or personal file paths first.
    validations:
      required: false
