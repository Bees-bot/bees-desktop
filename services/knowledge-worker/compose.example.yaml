services:
  knowledge:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./config.json:/etc/bees-knowledge/config.json:ro
      - knowledge-indexes:/var/lib/bees-knowledge/indexes
      - /srv/company-docs:/data/company-docs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  knowledge-indexes:
