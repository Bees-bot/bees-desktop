[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bees-knowledge-worker"
version = "0.1.0"
description = "Organization-controlled LlamaIndex MCP worker for Bees"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
dependencies = [
  "llama-index-core==0.14.22",
  "llama-index-embeddings-huggingface==0.6.1",
  "llama-index-readers-file==0.5.6",
]

[project.scripts]
bees-knowledge-worker = "bees_knowledge_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bees_knowledge_worker*"]
