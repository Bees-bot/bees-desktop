[[permission]]
identifier = "allow-bees-ui"
description = "Allows the Bees interface to manage its bundled local runtimes."
commands.allow = [
  "ensure_dsh_runtime",
  "restart_app",
  "local_model_status",
  "local_model_hardware",
  "ensure_local_model",
  "start_local_model",
  "stop_local_model",
  "cancel_local_model_download",
  "delete_local_model",
  "local_model_connection",
  "open_external_url",
  "bees_data_size",
  "uninstall_bees",
  "check_for_update",
  "install_update"
]
