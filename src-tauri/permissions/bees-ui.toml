[[permission]]
identifier = "allow-bees-ui"
description = "Allows the bundled Bees UI to use the desktop application commands."
commands.allow = [
  "db_query",
  "db_execute",
  "db_transaction",
  "validate_directory",
  "list_location_files",
  "read_location_file",
  "write_location_file",
  "list_agent_files",
  "write_agent_file",
  "ensure_team_skills_plugin",
  "write_team_skill",
  "update_team_skill_rule",
  "archive_team_skill",
  "delete_agent_file",
  "default_workspace_root",
  "ensure_directory",
  "create_workspace",
  "copy_input_files",
  "write_workspace_output",
  "collect_outputs",
  "preview_output",
  "publish_output",
  "cleanup_workspace",
  "bind_dsh_workspace",
  "purge_dsh_execution_state",
  "install_agent_plugin",
  "install_bundled_agent_plugin",
  "plugin_catalog",
  "install_catalog_plugin",
  "search_mcp_registry",
  "remove_registry",
  "local_model_status",
