[package]
name = "bees-desktop"
version = "0.2.0"
description = "DSH-powered work coordination"
authors = ["Bees contributors"]
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "bees_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1" # tauri::generate_context! expands to serde_json calls
sha2 = "0.10"
sysinfo = { version = "0.36.1", default-features = false, features = ["system", "disk"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
