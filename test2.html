<!DOCTYPE html>
<html>
<style>
.bees-flex-widget { display: flex; flex-direction: column; height: 144px; background: #eee; border: 1px solid #ccc; width: 400px; }
.bees-flex-widget-handle { height: 42px; background: #ddd; }
.bees-flex-widget-body { flex: 1; padding: 12px; }
.bees-flex-widget-body:has(> .bees-dashboard-metrics) { display: flex; flex-direction: column; justify-content: center; }
.bees-dashboard-metrics { margin-bottom: 30px; overflow: hidden; display: grid; justify-content: center; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; align-items: center; background: #fafafa; }
.bees-dashboard-metric { display: grid; place-items: center; background: pink; }
</style>
<div class="bees-flex-widget">
  <div class="bees-flex-widget-handle">Header</div>
  <div class="bees-flex-widget-body">
    <div class="bees-dashboard-metrics">
       <div class="bees-dashboard-metric">1</div>
    </div>
  </div>
</div>
</html>
