# Bees-owned profile overlay. DSH's shipped base and Web bundles remain upstream-owned.

- id: session-persistence-jsonl
  disabled: true

- insert:
    - id: session-persistence-sqlite
      name: '@deepseek-ai/dsh-session-persistence-sqlite'
      config:
        path: !!js process.env.BEES_DSH_SESSIONS_PATH
        journalMode: wal
        busyTimeoutMs: 5000
        preparedSessionCacheSize: 32
        writeBatchMaxDelayMs: 25

- id: session-query-sqlite
  config:
    path: !!js process.env.BEES_DSH_QUERY_PATH
    openAt: startup

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.BEES_DEFAULT_WORKSPACE

# Keep the upstream Models settings page, but give clean installs a keyless
# local OpenAI-compatible route. That makes onboarding optional while leaving
# provider/model configuration in DSH where it belongs.
- id: llm-pi-ai
  config:
    providers:
      local-openai:
        displayName: Local OpenAI-compatible
        api: openai-completions
        baseURL: http://127.0.0.1:1234/v1
        models:
          - id: default
            name: Local model
            contextWindow: 32768
            maxTokens: 4096

- insert:
    - id: bees
      name: '@bees/dsh-plugin'
      inject: [webServer, agents, agentPresets, sessionPersistence, approval, workspaceRegistry, settings]
