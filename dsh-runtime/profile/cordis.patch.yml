# Bees-owned profile overlay. DSH's shipped base and Web bundles remain upstream-owned.

- id: session-query-sqlite
  config:
    path: !!js process.env.BEES_DSH_QUERY_PATH
    openAt: startup

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.BEES_DEFAULT_WORKSPACE

- id: ui-settings-models
  disabled: true

- id: agent-default-model
  config:
    provider: local-openai
    model: active

# DSH Agent Teams replaces the old parent/child control surface with a
# durable peer mailbox and shared task board. One-shot delegation remains mounted
# for non-Bees sessions; the Bees plugin scopes it out of managed work runs.
- id: tool-subagent-control
  disabled: false

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: false
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  disabled: false
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

# Provider transport remains in DSH's llm-pi-ai plugin. The Bees feature
# plugins own their setup UI and lifecycle without registering duplicate routes.
- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      local-openai:
        displayName: Bees AI
        api: openai-completions
        baseURL: http://127.0.0.1:1234/v1
        # llama-server wants no auth, but pi-ai refuses a provider with neither key nor header.
        headers: { authorization: "Bearer local" }
        models:
          - id: active
            name: Bees AI model
            contextWindow: 8192
            maxTokens: 4096
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
    - id: bees-local-ai
      name: '@bees/dsh-local-ai'
    - id: bees-subscriptions
      name: '@bees/dsh-subscriptions'
    - id: bees-free-ai
      name: '@bees/dsh-free-ai'
    - id: bees-custom-ai
      name: '@bees/dsh-custom-ai'
    - id: bees
      name: '@bees/dsh-plugin'
      inject: [webServer, agents, agentPresets, sessionPersistence, approval, workspaceRegistry, settings, credentials, agentDefaultModel, llm, skills, tools, agentTeams, tokenMeter, sessions, attachments]
