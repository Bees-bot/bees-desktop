# Bees-owned profile overlay. DSH's shipped base and Web bundles remain upstream-owned.

- id: session-persistence-jsonl
  disabled: true

- insert:
    - id: session-persistence-sqlite
      name: '@deepseek-ai/dsh-session-persistence-sqlite'
      config:
        path: !!js process.env.BEES_DSH_SESSIONS_PATH
        journalMode: wal
        busyTimeoutMs: 5000
        preparedSessionCacheSize: 32
        writeBatchMaxDelayMs: 25

- id: session-query-sqlite
  config:
    path: !!js process.env.BEES_DSH_QUERY_PATH
    openAt: startup

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.BEES_DEFAULT_WORKSPACE

- id: ui-settings-models
  disabled: true

- id: agent-default-model
  config:
    provider: local-openai
    model: active

# Provider transport remains in DSH's llm-pi-ai plugin. The Bees feature
# plugins own their setup UI and lifecycle without registering duplicate routes.
- id: llm-pi-ai
  config:
    providers:
      local-openai:
        displayName: Local OpenAI-compatible
        api: openai-completions
        baseURL: http://127.0.0.1:1234/v1
        models:
          - id: active
            name: Nanbeige 4.2 3B (Q6_K)
            contextWindow: 8192
            maxTokens: 4096
- insert:
    - id: bees-local-ai
      name: '@bees/dsh-local-ai'
    - id: bees-subscriptions
      name: '@bees/dsh-subscriptions'
    - id: bees-free-ai
      name: '@bees/dsh-free-ai'
    - id: bees-custom-ai
      name: '@bees/dsh-custom-ai'
    - id: bees
      name: '@bees/dsh-plugin'
      inject: [webServer, agents, agentPresets, sessionPersistence, approval, workspaceRegistry, settings, agentDefaultModel, llm]
