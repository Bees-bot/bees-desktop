# Bees-owned profile overlay. DSH's shipped base and Web bundles remain upstream-owned.

- id: session-query-sqlite
  config:
    path: !!js process.env.BEES_DSH_QUERY_PATH
    openAt: startup

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.BEES_DEFAULT_WORKSPACE

- id: ui-settings-models
  disabled: true

# Temporal is the only scheduler for Bees work. Long runs receive an explicit clock.
- id: schedule
  disabled: true

- id: ui-schedule
  disabled: true

- id: time-context
  disabled: false
  config:
    refreshIntervalMs: 600000

# Match small local model contexts; native retention preserves recoverable text/images.
- id: spill-policy
  config:
    maxInlineTokens: 2000

# Runs mount the standard preset, whose nested rows no patch can reach by id, so this is a copy
# of dsh-web-app's preset. The 64k default headroom left a 16k to 60k local window no pressure budget.
- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          suffix: Your working directory is {{cwd}}.
          prefix: You are a coding agent powered by the {{model}} model.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
            # a summary under the headroom keeps the summarizer request inside the window, with room for its prompt
            config:
              headroomTokens: 8192
              maxTokens: 6144
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
              backgroundMode: continuable
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            disabled: true
            config:
              subagentProvider: spawn
              maxRounds: 64
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true

# Sites like GitHub put the page's real content past the first 100,000 characters.
- id: web-fetch-http
  config:
    maxBodyChars: 2000000

# A patch replaces the whole config, so keep the base search timeout.
- id: tool-web
  config:
    searchTimeoutMs: 60000
    fetchMaxOutputChars: 2000000

- id: ui-chat
  config:
    transcriptView: compact

- id: agent-default-model
  config:
    provider: local-openai
    model: active

# DSH Agent Teams replaces the old parent/child control surface with a
# durable peer mailbox and shared task board. One-shot delegation remains mounted
# for non-Bees sessions; the Bees plugin scopes it out of managed work runs.
- id: tool-subagent-control
  disabled: false

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: false
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot

- id: tool-subagent-fork
  disabled: false
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

# Provider transport remains in DSH's llm-pi-ai plugin. The Bees feature
# plugins own their setup UI and lifecycle without registering duplicate routes.
- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      local-openai:
        displayName: Bees AI
        api: openai-completions
        baseURL: http://127.0.0.1:1234/v1
        # llama-server wants no auth, but pi-ai refuses a provider with neither key nor header.
        headers: { authorization: "Bearer local" }
        models:
          - id: active
            name: Bees AI model
            contextWindow: 8192
            maxTokens: 4096
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork
    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
    - id: bees-local-ai
      name: '@bees/dsh-local-ai'
    - id: bees-subscriptions
      name: '@bees/dsh-subscriptions'
      config:
        models:
          - default
          - sonnet
          - opus
          - haiku
    - id: bees-free-ai
      name: '@bees/dsh-free-ai'
    - id: bees-custom-ai
      name: '@bees/dsh-custom-ai'
    - id: bees
      name: '@bees/dsh-plugin'
      inject: [ webServer, agents, agentPresets, sessionPersistence, approval, workspaceRegistry, settings, credentials, agentDefaultModel, llm, skills, tools, agentTeams, tokenMeter, sessions, attachments, jobs, fs ]
      config:
        localModelCatalog:
          - id: qwen3-4b-instruct-2507-q4-k-m
            name: Qwen3 4B Instruct (Q4_K_M)
            fileName: Qwen3-4B-Instruct-2507-Q4_K_M.gguf
            url: https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf?download=true
            bytes: 2497281120
            sha256: 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597
            runsProcesses: false
        themePreset: halloween
        colorMode: dark
        darkThemePreset: business
        lightThemePreset: corporate
        dashboards:
          - id: home
            name: Home
            widgets:
              - kind: outcome
                x: 0
                y: 0
                w: 10
                h: 4
              - kind: quick-actions
                x: 10
                y: 0
                w: 2
                h: 4
              - kind: waiting
                x: 0
                y: 4
                w: 5
                h: 7
              - kind: recent-work
                x: 5
                y: 4
                w: 7
                h: 7
              - kind: completed
                x: 0
                y: 11
                w: 12
                h: 6
        workItemLayout:
          - kind: kanban
            x: 0
            y: 0
            w: 12
            h: 4
          - kind: run-status
            x: 0
            y: 4
            w: 12
            h: 1
          - kind: conversation
            x: 0
            y: 5
            w: 6
            h: 8
          - kind: details
            x: 6
            y: 5
            w: 6
            h: 8
        pageLayouts: {}
        systemInstructions: ""
        codexModels: []
        generalAiModels: {}
        generalAiProviders: []
